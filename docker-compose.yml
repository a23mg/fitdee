services:
  postgres:
    image: postgres:16-alpine
    container_name: fitdee_postgres
    restart: always
    environment:
      POSTGRES_USER: fitdee
      POSTGRES_PASSWORD: fitdeepassword
      POSTGRES_DB: fitdee_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
