<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
		<meta name="theme-color" content="#ff0101" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Fitdee" />
		<link rel="manifest" href="/manifest.webmanifest" />

		<title>Fitdee | Intelligent Athletic Protocol</title>

		<script>
			try {
				if (localStorage.getItem('fitdee_theme') === 'light') {
					document.documentElement.classList.remove('dark');
				}
			} catch (_) {}

			// Register service worker if supported
			if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('/sw.js').catch(() => {});
				});
			}
		</script>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
		<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="min-h-[100dvh] selection:bg-[#ff0101] selection:text-white antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
